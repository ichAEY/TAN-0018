name: TANEM Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v5
      - name: Checkout stable ForMasters template
        uses: actions/checkout@v5
        with:
          repository: ichAEY/Shablon-For-Only-Masters
          ref: main
          path: .tanem-master
      - name: Install stable template
        shell: bash
        run: |
          set -euo pipefail
          cp site-data.mjs /tmp/site-data.mjs
          rsync -a --exclude '.git' --exclude 'site-data.mjs' .tanem-master/ ./
          cp /tmp/site-data.mjs site-data.mjs
          rm -rf .tanem-master
          sed -i 's|NEXT_PUBLIC_BASE_PATH: /Shablon-For-Only-Masters|NEXT_PUBLIC_BASE_PATH: /TAN-0018|g' .github/workflows/pages.yml
          rm -f .github/workflows/bootstrap.yml
      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tanem-factory"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build TAN-0018 from stable TANEM ForMasters template"
          git push
