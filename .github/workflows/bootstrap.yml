name: TANEM Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v5
      - name: Checkout stable ForMasters template
        uses: actions/checkout@v5
        with:
          repository: ichAEY/Shablon-For-Only-Masters
          ref: main
          path: .tanem-master
      - name: Install stable template
        shell: bash
        run: |
          set -euo pipefail
          cp site-data.mjs /tmp/site-data.mjs
          rsync -a --exclude '.git' --exclude 'site-data.mjs' --exclude '.github/workflows' .tanem-master/ ./
          cp /tmp/site-data.mjs site-data.mjs
          rm -rf .tanem-master
      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tanem-factory"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Template already installed."
            exit 0
          fi
          git commit -m "Build TAN-0018 from stable TANEM ForMasters template"
          git push
