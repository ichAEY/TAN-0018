name: Quality and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages-config.outputs.enabled }}
      custom-domain: ${{ steps.pages-config.outputs.custom-domain }}
    env:
      EXPECTED_CUSTOM_DOMAIN: "svetlana.tanem.ru"
    steps:
      - uses: actions/checkout@v5
      - name: Checkout approved Hair decoration source
        uses: actions/checkout@v5
        with:
          repository: ichAEY/Shablon-Hair-Master
          ref: d9ce7e2cd6fa16ad900fce2568b584cbc5a84481
          path: .tanem-source-hair
      - name: Prepare approved template assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/template
          cp .tanem-source-hair/public/assets/yulia/tools/hero.png public/assets/template/hair-tools.png
          rm -rf .tanem-source-hair
          test -s public/assets/template/hair-tools.png
      - id: pages-config
        name: Detect Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/pages" >/tmp/pages.json 2>/dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "custom-domain=" >> "$GITHUB_OUTPUT"
            echo "base-path=/TAN-0018" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository."
            exit 0
          fi
          current="$(jq -r '.cname // ""' /tmp/pages.json)"
          echo "Pages custom domain: ${current:-<none>}"
          echo "Expected custom domain: $EXPECTED_CUSTOM_DOMAIN"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "custom-domain=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$EXPECTED_CUSTOM_DOMAIN" ]; then
            echo "base-path=" >> "$GITHUB_OUTPUT"
          else
            echo "base-path=/TAN-0018" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Render production scenarios
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages-config.outputs.base-path }}
        run: npm run qa:scenarios
      - name: Build production site
        if: steps.pages-config.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages-config.outputs.base-path }}
        run: npm run build
      - if: steps.pages-config.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages-config.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages-ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
